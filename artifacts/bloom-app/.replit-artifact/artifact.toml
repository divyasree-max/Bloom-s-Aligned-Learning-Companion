kind = "web"
previewPath = "/"
title = "Bloom Aligned Learning Companion"
version = "1.0.0"
id = "artifacts/bloom-app"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21646

[services.development]
run = "pnpm --filter @workspace/bloom-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/bloom-app", "run", "build" ]
publicDir = "artifacts/bloom-app/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21646"
BASE_PATH = "/"
